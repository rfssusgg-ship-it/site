<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f030a" />
      <stop offset="100%" stop-color="#0a0104" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3360" />
      <stop offset="100%" stop-color="#b80c2f" />
    </linearGradient>
    <filter id="crimsonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#ff1e4d" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Arka Plan Kartı -->
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#bgGrad)" stroke="#ff2e58" stroke-width="2" />

  <!-- Gamepad Gövdesi -->
  <g filter="url(#crimsonGlow)">
    <!-- Ana Kontrolör Şekli -->
    <path d="M19 19 C24 18, 40 18, 45 19 C52 20, 56 26, 54 36 C52 44, 46 47, 43 45 C40 43, 37 36, 35 36 C33 36, 31 38, 29 38 C27 38, 25 36, 23 36 C21 36, 18 43, 15 45 C12 47, 6 44, 4 36 C2 26, 6 20, 13 19 Z" fill="url(#redGrad)" />
    
    <!-- Üst Tetikler -->
    <path d="M16 16 C20 14, 25 15, 25 17 L16 18 Z" fill="#ff6b8b" opacity="0.9" />
    <path d="M48 16 C44 14, 39 15, 39 17 L48 18 Z" fill="#ff6b8b" opacity="0.9" />

    <!-- D-Pad (Yön Tuşları - Sol) -->
    <rect x="15.5" y="25" width="3" height="9" rx="1" fill="#ffffff" />
    <rect x="12.5" y="28" width="9" height="3" rx="1" fill="#ffffff" />

    <!-- Aksiyon Tuşları (Sağ - 4 Buton) -->
    <!-- Üst Tuş (Y) -->
    <circle cx="45" cy="25" r="1.6" fill="#ffffff" />
    <!-- Sol Tuş (X) -->
    <circle cx="41.5" cy="28.5" r="1.6" fill="#ffffff" />
    <!-- Sağ Tuş (B) -->
    <circle cx="48.5" cy="28.5" r="1.6" fill="#ffffff" />
    <!-- Alt Tuş (A) -->
    <circle cx="45" cy="32" r="1.6" fill="#ffffff" />

    <!-- Analog Thumbsticks (Orta-Alt İkili Çubuk) -->
    <circle cx="25" cy="34" r="3.2" fill="#140206" stroke="#ff4770" stroke-width="1.2" />
    <circle cx="25" cy="34" r="1.3" fill="#ffffff" />

    <circle cx="33" cy="34" r="3.2" fill="#140206" stroke="#ff4770" stroke-width="1.2" />
    <circle cx="33" cy="34" r="1.3" fill="#ffffff" />

    <!-- Orta GG / Menü Işığı -->
    <circle cx="29" cy="24.5" r="1.5" fill="#ffffff" />
  </g>
</svg>
